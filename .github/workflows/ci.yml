name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  repo-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 .github/scripts/check_repo.py

  # 条件を壊してもテストが通る箇所を，PR が変えた行に限って探す
  mutants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - run: git diff "origin/$BASE_REF..." -- codo-core > pr.diff
        env:
          BASE_REF: ${{ github.base_ref }}
      # 既定の作業コピーは target/ を持たず rust-cache が効かないので，その場で変異させる
      - run: cargo mutants --no-shuffle --in-place --in-diff pr.diff -p codo-core
      - if: failure() && hashFiles('mutants.out/missed.txt') != ''
        run: |
          {
            echo "### テストをすり抜けた変更"
            echo
            echo "次のように書き換えてもテストが通りました．これを検出するテストを足してください．"
            echo
            echo '```'
            cat mutants.out/missed.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
